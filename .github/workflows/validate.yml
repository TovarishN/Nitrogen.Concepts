name: Validate catalog

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    env:
      # Nitrogen's packages on GitHub Packages (nuget.config); each package grants this repository read access.
      NuGetPackageSourceCredentials_nitrogen: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Catalog.slnx
      - run: dotnet run --project tools/Catalog -- validate
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .catalog-base
      - run: dotnet run --project tools/Catalog -- validate --base .catalog-base
        if: github.event_name == 'pull_request'
